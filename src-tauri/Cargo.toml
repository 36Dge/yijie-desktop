[package]
name = "yijie-desktop"
version = "0.1.0"
description = "Yijie AI Mac desktop app"
authors = ["Yijie AI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yijie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "=0.1.91"
openidconnect = "=4.0.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "sync", "time"] }
url = "=2.5.8"
uuid = "=1.23.4"
webbrowser = { version = "=1.2.2", default-features = false, features = ["hardened"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["protected"] }
keyring-core = "=1.0.0"
