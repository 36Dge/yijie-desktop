name: CI
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: macos-latest
    env:
      CONTRACTS_DIR: .contracts-source
      YIJIE_DESKTOP_CONTRACTS_DIR: .contracts-source
      YIJIE_DESKTOP_AGENT_HOST_DIR: .agent-host-source
      YIJIE_DESKTOP_SKILLS_DIR: .skills-source
      YIJIE_DESKTOP_SKILL_BUNDLE_TEST_ROOT: ${{ github.workspace }}/.local/skill-packages
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 36Dge/yijie-contracts
          ref: 164b14f609537d727a52326832da04430aecc4ab
          path: .contracts-source
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 36Dge/yijie-agent-host
          ref: 1b7bfd1ce4323e52035b2ba1e62842c2d332d9ed
          path: .agent-host-source
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 36Dge/yijie-skills
          ref: 10c45bec29603b002e861e1499d5b4e684251af5
          path: .skills-source
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir .skills-source install --frozen-lockfile
      - run: pnpm skills:sync:all
      - run: pnpm skills:check
      - run: pnpm skills:release-boundary
      - run: rustup show
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: make lint
      - run: make test
      - run: make build
      - run: pnpm docs:build
      - run: pnpm tauri:build --debug
      - run: pnpm audit --audit-level high
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file src-tauri/Cargo.lock
