name: CI
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: yijie-desktop
    env:
      YIJIE_ENV: local
      YIJIE_LOCAL_PROFILE: demo_fast
      YIJIE_RUNTIME_PERMISSIONS_ENABLED: "true"
      VITE_YIJIE_RUNTIME_PERMISSIONS_ENABLED: "true"
      CONTRACTS_DIR: ../yijie-contracts
      YIJIE_DESKTOP_CONTRACTS_DIR: ../yijie-contracts
      YIJIE_DESKTOP_AGENT_HOST_DIR: ../yijie-agent-host
      YIJIE_DESKTOP_SKILLS_DIR: ../yijie-skills
      YIJIE_DESKTOP_SKILL_BUNDLE_TEST_ROOT: ${{ github.workspace }}/.local/skill-packages
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: yijie-desktop
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 36Dge/yijie-contracts
          ref: 6f632f155eacdaf93df0e0b00b5dab9e369c5442
          path: yijie-contracts
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 36Dge/yijie-agent-host
          ref: f4cf01bd6f7e9f37792ef743d44f0ce10527c10b
          path: yijie-agent-host
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 36Dge/yijie-skills
          ref: 10c45bec29603b002e861e1499d5b4e684251af5
          path: yijie-skills
          fetch-depth: 0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.7.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: yijie-desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ../yijie-contracts install --frozen-lockfile
      - run: pnpm --dir ../yijie-skills install --frozen-lockfile
      - run: pnpm skills:sync:all
      - run: pnpm skills:check
      - run: pnpm skills:release-boundary
      - run: rustup show
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: make lint
      - run: make test
      - run: make build
      - run: pnpm docs:build
      - run: pnpm tauri:build --debug
      - run: pnpm audit --audit-level high
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file src-tauri/Cargo.lock
